services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka-trading-broker
    ports:
      - "9092:9092"
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: kafka-trading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
